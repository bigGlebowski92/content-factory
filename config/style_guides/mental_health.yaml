version: "1.0"
direction: "Ментальное здоровье и wellbeing"

rules:
  - "Опирайся только на достоверные источники"
  - "Пиши в активном залоге"
  - "Избегай меджаргона без пояснения"
  - "Давай практические выводы"
  - "Без сенсационности"
  - "Уважай автономию читателя"

forbidden_phrases:
  - "guaranteed cure"
  - "medical diagnosis"
  - "individual treatment recommendation"
  - "medical promise"
  - "will cure your"
  - "diagnose yourself"
  - "personal medical advice"

required_elements:
  article:
    - "thesis"
    - "facts_with_sources"
    - "practical_conclusion"
    - "cta"
  post:
    - "single_idea"
    - "link_to_article"
  review:
    - "what_happened"
    - "why_important"
    - "sources"

tone_guidelines:
  - "Спокойно и взвешенно"
  - "На основе фактов, без предписаний"
  - "С уважением к сложности темы"
  - "Практично и применимо"

avoid_patterns:
  - "Шаблонные AI-вступления вроде «В современном мире...»"
  - "Избыточные связки"
  - "Злоупотребление пассивом"
  - "Однотипные конструкции предложений"
  - "Листрикл без повествования"
